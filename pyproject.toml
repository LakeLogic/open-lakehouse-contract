[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-lakehouse-contract"
version = "0.28.0"
description = "Define and validate lakehouse data contracts in YAML. Includes a Python CLI, JSON Schema and AI agent integrations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "LakeLogic" }]
# What people search for when they need this (data contract validation, schema validation…);
# `odcs` because the README explains how OLC and ODCS relate (docs/concepts/vs-odcs.md).
keywords = ["data-contracts", "lakehouse", "data-contract-validation", "schema-validation",
            "data-quality", "data-governance", "yaml", "json-schema", "cli", "odcs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["jsonschema>=4.18", "pyyaml>=6.0"]

# The `olc validate` CLI stays lightweight (jsonschema only). The strict Pydantic
# model (olc.models) — the source the JSON Schema is generated from — needs pydantic;
# install it with `pip install open-lakehouse-contract[models]`.
[project.optional-dependencies]
models = ["pydantic>=2"]

[project.urls]
Homepage = "https://www.lakelogic.io"
Repository = "https://github.com/LakeLogic/open-lakehouse-contract"
Documentation = "https://olc.lakelogic.io/"
Changelog = "https://github.com/LakeLogic/open-lakehouse-contract/blob/main/CHANGELOG.md"
Issues = "https://github.com/LakeLogic/open-lakehouse-contract/issues"

[project.scripts]
olc = "olc.cli:main"

[tool.setuptools]
packages = ["olc", "olc.models"]

# schema/ + skills/ are vendored into olc/_bundled/ at build time (see setup.py) so
# `olc validate` (schema) and `olc init` (skill templates) work from a plain
# `pip install`, not just an editable checkout.
[tool.setuptools.package-data]
olc = ["_bundled/**/*"]

# `cz bump` reads/writes the single source of truth — [project].version (PEP 621) —
# so there is no duplicate version literal to drift. Conventional-commit history
# drives the SemVer bump. The changelog is owned by git-cliff (cliff.toml), run by
# the `changelog` workflow on the pushed tag — so `update_changelog_on_bump` is
# FALSE here to avoid cz and git-cliff both writing CHANGELOG.md (mirrors LL).
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = false
changelog_file = "CHANGELOG.md"
changelog_incremental = false
major_version_zero = true
