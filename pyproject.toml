[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-lakehouse-contract"
version = "0.1.0"
description = "The Open Lakehouse Contract — an open, executable, SQL-native data-product contract. CLI + validator + agent integrations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "LakeLogic" }]
keywords = ["data-contract", "lakehouse", "data-quality", "odcs", "spec-driven"]
dependencies = ["jsonschema>=4.18", "pyyaml>=6.0"]

# The `olc validate` CLI stays lightweight (jsonschema only). The strict Pydantic
# model (olc.models) — the source the JSON Schema is generated from — needs pydantic;
# install it with `pip install open-lakehouse-contract[models]`.
[project.optional-dependencies]
models = ["pydantic>=2"]

[project.urls]
Homepage = "https://lakelogic.org"
Repository = "https://github.com/LakeLogic/open-lakehouse-contract"

[project.scripts]
olc = "olc.cli:main"

[tool.setuptools]
packages = ["olc", "olc.models"]

# schema/ + skills/ are vendored into olc/_bundled/ at build time (see setup.py) so
# `olc validate` (schema) and `olc init` (skill templates) work from a plain
# `pip install`, not just an editable checkout.
[tool.setuptools.package-data]
olc = ["_bundled/**/*"]
