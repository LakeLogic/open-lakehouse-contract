name: Deploy Documentation

# Mirrors the LakeLogic (LL) docs deploy: on every push to main, build the mkdocs
# site and publish it to the gh-pages branch, which GitHub Pages serves at
# https://lakelogic.github.io/open-lakehouse-contract/ (mkdocs.yml site_url).
# OLC installs docs deps from docs-requirements.txt (mkdocs-material) rather than
# a [docs] extra, and has no notebook-sync step, so those LL-specific bits are omitted.

on:
    push:
        branches:
            - main
            - master
    workflow_dispatch:

permissions:
    contents: write # mkdocs gh-deploy pushes the built site to the gh-pages branch

# Avoid overlapping deploys racing on gh-pages.
concurrency:
    group: docs-deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # gh-deploy needs history to update the gh-pages branch

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install docs dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r docs-requirements.txt

            - name: Deploy to GitHub Pages (mkdocs gh-deploy)
              run: mkdocs gh-deploy --force
