# A Core playbook recipe: what a contract looks like for one job, and every value a person sets.
# The contract below is loaded by OLC's strict validator and by LakeLogic Core in the release
# tests; {placeholders} are the parameters listed under `parameters`.
id: ingest-database-to-landing
group: ingest
title: Ingest a database table into the landing zone
when: >-
  A table in PostgreSQL, MySQL, SQL Server / Azure SQL, Oracle or SQLite should be copied into the
  lakehouse's landing zone as files, a full copy first and only new or changed rows after that.
load_patterns: [full, incremental]
contract:
  version: 1.0.0
  dataset: "{source_table}"
  info:
    title: "{source_table} from {source_system}"
    target_layer: bronze
    system: "{source_system}"
  source:
    type: database
    path: env:SRC_DB_URL
    load_mode: incremental
    watermark_field: "{watermark_column}"
    # How hard the read is on the source database. Every database ingestion sets these on
    # purpose: an unbounded read (above all from Spark) can exhaust a small database tier.
    options:
      fetch_size: "{fetch_size}"
  model:
    fields:
      - name: id
        type: long
        required: true
        description: Replace with the table's own columns, or let Studio draft them from the table.
      - name: "{watermark_column}"
        type: timestamp
        description: When the row last changed; each run reads only rows newer than the last one read.
  materialization:
    strategy: append
    target_path: "{landing_path}"
    format: parquet
  # Where each run records how far it read. Without it every run re-reads the whole table.
  metadata:
    run_log_table: "{run_log_table}"
parameters:
  - name: SRC_DB_URL
    what: How to connect to the source database.
    set_in: environment variable (or a key vault secret exposed as one)
    secret: true
    format: "<dialect>://<user>:<password>@<host>:<port>/<database>"
    examples:
      - "postgresql://ingest:****@pg-prod.postgres.database.azure.com:5432/sales?sslmode=require"
      - "mysql://ingest:****@mysql-prod.example.com:3306/sales"
      - "mssql://ingest:****@sql-prod.database.windows.net:1433/sales?encrypt=true"
    notes: The password never goes in the contract — the contract says env:SRC_DB_URL and the run reads it.
  - name: source_table
    what: The table to copy, schema-qualified where the database needs it.
    set_in: contract
    secret: false
    format: "<schema>.<table>"
    examples: ["public.orders", "dbo.orders"]
  - name: source_system
    what: The system the table belongs to; names the landing folder and the bronze table.
    set_in: contract
    secret: false
    format: snake_case name
    examples: ["erp", "rideflow"]
  - name: watermark_column
    what: A column that grows when a row is added or changed, so later runs read only new rows.
    set_in: contract
    secret: false
    format: a timestamp or ever-increasing number column of the source table
    examples: ["updated_at", "modified_date", "row_version"]
    notes: No such column? Use load_mode full (copies the whole table each run), or SQL Server CDC.
  - name: landing_path
    what: The folder in the landing zone the files are written to, one folder per table.
    set_in: _system.yaml environment ({landing_root}) — a different place per environment
    secret: false
    format: "<landing_root>/<system>/<table>"
    examples:
      - "abfss://landing@mystorage.dfs.core.windows.net/erp/orders"
      - "s3://my-landing-bucket/erp/orders"
      - "/Volumes/prod_erp/files/landing/erp/orders"
  - name: fetch_size
    what: Rows fetched per round trip to the database — how much the source serves at a time.
    set_in: contract (source.options.fetch_size)
    secret: false
    format: "a whole number of rows; size it to the row width and the database tier"
    examples: ["10000", "50000", "5000"]
    notes: >-
      Start at 10000 for a small tier (Azure SQL Basic / S0, a B-series PostgreSQL) or wide rows,
      50000 for a general-purpose tier. Polars reads in chunks of this size, but combines them before
      writing, so the whole run's result must still fit in memory — for very large tables, split the
      load (incremental, or a source.query per range). Spark passes it as the JDBC fetchsize (default
      10000). DuckDB streams the scan itself and ignores it.
  - name: partition_column
    what: Optional — read in parallel slices of this column (Spark and Polars only).
    set_in: contract (source.options.partition_column + partition_num), only when one connection is too slow
    secret: false
    format: "a numeric or date column with an index, e.g. the primary key"
    examples: ["id"]
    notes: >-
      Each slice is a separate concurrent query, so partition_num multiplies the load on the source:
      keep it well under the database's concurrent-request limit (Azure SQL Basic allows 30; 4 is a
      safe start). On Spark you MUST also set partition_lower_bound and partition_upper_bound (the
      column's min and max); without them Spark reads with a single connection.
  - name: run_log_table
    what: Where each run records how far it read (the watermark), so the next run starts there.
    set_in: contract — in a Studio project the project's _system.yaml sets it for every table
    secret: false
    format: "<schema>.<table> on the platform; run_log_dir / run_log_path (a folder or JSON file) also work"
    examples: ["lakelogic.run_logs", "bronze.run_logs"]
    notes: Lose it and the next run copies the whole table again — keep it with the pipeline, not in a temp folder.
  - name: storage login
    what: How the run signs in to the landing storage.
    set_in: environment variables
    secret: true
    format: "AZURE_STORAGE_ACCOUNT + (AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID) or AZURE_STORAGE_ACCOUNT_KEY; AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY for S3"
    examples: ["AZURE_STORAGE_ACCOUNT=mystorage"]
    notes: On Databricks, Fabric or Glue the platform's own identity is used and none of these are needed.
before_you_run:
  - Set SRC_DB_URL where the pipeline runs (environment or key vault).
  - Allow the pipeline's network address through the database firewall.
  - Give the pipeline's identity write access to the landing folder.
studio_test: >-
  Studio checks the contract and runs it on generated rows written to a sandbox folder; it never
  connects to your database or writes to your landing zone. The first real run is yours.
# Filled from a real run, never ahead of one.
proven: >-
  2026-10-22, LakeLogic Core on Polars: PostgreSQL 16 (Azure Flexible Server) and Azure SQL each
  copied 50 rows to ADLS Gen2, then an incremental run read only the 7 rows added since; 57 rows
  read back from the landing folder. With fetch_size 20 each database served the reads in chunks of
  at most 20 rows (3, then 1). Not yet proven live: the Spark JDBC read and partitioned reads.
  (lakelogic examples/playbook/prove_ingest_database_to_landing.py)
