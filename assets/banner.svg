<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Open Lakehouse Contract — a portable, executable, SQL-native contract for the lakehouse">
  <defs>
    <pattern id="olc-dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1f6feb"/>
    </pattern>
    <linearGradient id="olc-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="olc-fademask">
      <rect x="0" y="0" width="470" height="300" fill="url(#olc-fade)"/>
    </mask>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="300" fill="#0a0e14"/>
  <rect x="0" y="0" width="470" height="300" fill="url(#olc-dots)" mask="url(#olc-fademask)" opacity="0.75"/>
  <rect x="8.5" y="8.5" width="1183" height="283" fill="none" stroke="#20262e" stroke-width="1"/>

  <!-- wordmark -->
  <text x="470" y="118" class="mono" font-size="42" font-weight="700" letter-spacing="2" fill="#f0f6fc">OPEN LAKEHOUSE</text>
  <text x="470" y="168" class="mono" font-size="42" font-weight="700" letter-spacing="2" fill="#f0f6fc">CONTRACT</text>

  <!-- hairline divider -->
  <line x1="472" y1="196" x2="1140" y2="196" stroke="#20262e" stroke-width="1"/>

  <!-- tagline -->
  <text x="472" y="224" class="mono" font-size="17" letter-spacing="1" fill="#8b949e">A portable, executable, SQL-native contract for the lakehouse</text>

  <!-- engine / format tokens -->
  <text x="472" y="258" class="mono" font-size="15" letter-spacing="1" fill="#39c5cf">Spark &#183; DuckDB &#183; Polars<tspan fill="#586069">    &#8594;    </tspan>Delta &#183; Iceberg &#183; DuckLake</text>
</svg>
