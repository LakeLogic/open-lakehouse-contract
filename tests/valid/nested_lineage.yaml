# Multi-hop lineage in both directions must validate against the schema:
#   upstream_sources  — source_system -> landing -> this contract (producers with no
#                       OLC file of their own), nested.
#   downstream        — table -> semantic_model -> report (consumers with no OLC file
#                       of their own), nested.
version: 1.0.0
info:
  title: Bronze GA4 app events
  table_name: bronze_google_analytics_app_events
model:
  fields:
    - name: event_name
      type: string
upstream_sources:
  - type: landing
    name: GA4 app_events landing
    path: "{landing_root}/app_events"
    format: json
    upstream_sources:
      - type: source_system
        name: Google Analytics 4
        system: Google LLC
downstream:
  - type: semantic_model
    name: RideFlow Gold
    platform: powerbi
    consumers:
      - type: report
        name: RideFlow Executive
        platform: powerbi
