version: 1.0.0
info: { title: Riders, table_name: riders }
source:
  type: table
  path: upstream.riders_changes
  load_mode: cdc
  cdc_op_field: op
  cdc_delete_values: [D]
model:
  fields:
    - { name: id, type: integer, required: true }
    - { name: name, type: string }
    - { name: op, type: string }
    - { name: is_deleted, type: boolean }
primary_key: [id]
materialization:
  strategy: merge
  format: delta
  soft_delete_column: is_deleted
