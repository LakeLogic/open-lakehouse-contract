version: 1.0.0
info: { title: Orders, table_name: orders }
model:
  fields:
    - { name: id, type: integer, required: true }
    - { name: amount, type: float }
    - { name: fee, type: float }
    - { name: net, type: float }
transformations:
  - phase: post
    derive: { field: net, sql: amount - fee }
