version: 1.0.0
info: { title: Trips, table_name: trips }
model:
  fields:
    - { name: id, type: integer }
    - { name: driver_id, type: integer }
    - { name: trip_date, type: string }
links:
  - { name: drivers, path: "references/drivers.jsonl" }
quality:
  row_rules:
    - lifecycle_window:
        name: trip_within_driver_tenure
        event_ts: trip_date
        event_key: driver_id
        reference: drivers
        reference_key: driver_id
        start_field: start_date
        end_field: end_date
