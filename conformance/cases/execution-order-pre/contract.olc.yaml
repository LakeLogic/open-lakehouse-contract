version: 1.0.0
info:
  title: Orders
  table_name: orders
model:
  fields:
  - name: id
    type: int
  - name: amount
    type: float
  - name: fee
    type: float
transformations:
- phase: pre
  derive:
    field: net
    sql: amount - fee
quality:
  row_rules:
  - name: net_nonneg
    phase: pre
    sql: net >= 0
