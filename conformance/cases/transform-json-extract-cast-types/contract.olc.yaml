version: 1.0.0
info: { title: T, table_name: t }
model:
  fields:
    - { name: id, type: integer }
    - { name: payload, type: string }
    - { name: ts, type: timestamp }
    - { name: amt, type: decimal }
transformations:
  - phase: post
    json_extract: { field: ts, source: payload, path: "$.ts", cast: timestamp }
  - phase: post
    json_extract: { field: amt, source: payload, path: "$.amt", cast: decimal }
