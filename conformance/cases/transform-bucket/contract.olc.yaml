version: 1.0.0
info: { title: T, table_name: t }
model:
  fields:
    - { name: id, type: integer, required: true }
    - { name: price, type: float }
    - { name: band, type: string }
transformations:
  - phase: post
    bucket:
      field: band
      source: price
      bins:
        - { label: low, lt: 100 }
        - { label: high, gte: 100 }
